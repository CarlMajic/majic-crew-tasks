<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131416">
<title>Majic Crew Tasks</title>
<meta name="referrer" content="no-referrer">
<link rel="icon" href="./icon.svg">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./style.css">
<script defer src="./app.js?v=4"></script>
</head>
<body>
<header class="masthead"><div class="mast-inner">
  <a href="#" class="brand" aria-label="Majic Crew Tasks home"><img src="./icon.svg" alt=""><span>MAJIC <span class="brand-sub">CREW TASKS</span></span></a>
  <div id="profile"></div>
</div><nav id="event-navigation" class="event-navigation" aria-label="Events" hidden>
  <div class="event-navigation-inner">
    <a class="event-tab event-home" href="#">All events</a>
    <div id="event-tabs" class="event-tabs"></div>
    <button type="button" class="new-event-tab" data-action="create-event" aria-label="New event"><span aria-hidden="true">+</span><span>New Event</span></button>
  </div>
</nav></header>
<main id="app" aria-busy="true">
  <section class="panel welcome">
    <h1>Opening crew workspace</h1>
    <p class="muted">If the workspace stays on this screen, reload the page to reconnect.</p>
    <a class="button" href="">Reload workspace</a>
    <noscript><p class="error">Enable JavaScript in your browser to open Majic Crew Tasks.</p></noscript>
  </section>
</main>
<dialog id="modal" aria-labelledby="dialog-title"></dialog>
<div id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
